name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gate (lint + typecheck + layer + dup)
        run: npm run check
      - name: Tests (existing failures tracked, non-blocking)
        run: npm test
        continue-on-error: true